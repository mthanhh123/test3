<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gửi Shuna 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
          rel="stylesheet" />
    <style>
        :root {
            --pink: #ff6fae;
            --rose: #ff3d84;
            --gold: #ffd9a8;
            --text: #fff1f6;
            --serif: "Playfair Display", "Times New Roman", Georgia, serif;
            --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
            --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #030816;
        }

        body {
            color: var(--text);
            font-family: var(--sans);
        }

        /* Bầu trời đêm xanh thẳm */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at 10% 90%, rgba(30, 80, 180, 0.4) 0%, transparent 60%), radial-gradient(ellipse at 30% 100%, rgba(40, 100, 220, 0.2) 0%, transparent 50%), linear-gradient(to bottom right, #020712 0%, #061836 40%, #0a2a5e 100%);
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            z-index: -1;
        }

        .g1 {
            width: 70vmax;
            height: 70vmax;
            background: #1e3a8a;
            left: -20vmax;
            bottom: -30vmax;
        }

        .g2 {
            width: 50vmax;
            height: 50vmax;
            background: #3b82f6;
            right: -10vmax;
            top: -10vmax;
            opacity: 0.15;
        }

        .star {
            position: fixed;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #fff;
            animation: tw 3s infinite alternate;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes tw {
            from {
                opacity: 0.1;
            }

            to {
                opacity: 0.9;
                box-shadow: 0 0 8px #fff;
            }
        }

        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            transition: opacity 1s, transform 1s;
            z-index: 2;
        }

            #stage.hide {
                opacity: 0;
                transform: scale(0.92);
                pointer-events: none;
            }

        .line {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            font-family: var(--serif);
            font-weight: 900;
            line-height: 1.15;
        }

        .l1 {
            font-size: clamp(1.9rem, 8.5vw, 4rem);
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .l2 {
            font-size: clamp(2.6rem, 12vw, 5.8rem);
            color: var(--pink);
            text-shadow: 0 0 30px var(--rose);
        }

        .slot {
            display: inline-block;
            opacity: 0;
            min-width: 0.05em;
        }

            .slot.sp {
                min-width: 0.35em;
            }

            .slot.ok {
                opacity: 1;
                animation: pop 0.6s;
            }

        @keyframes pop {
            0% {
                transform: scale(1.6);
                filter: brightness(2.5);
            }

            100% {
                transform: none;
                filter: none;
            }
        }

        .fly {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 3;
            pointer-events: none;
            font-family: var(--serif);
            font-weight: 900;
            color: #ffb3d4;
            text-shadow: 0 0 14px var(--rose);
            will-change: transform;
            transition: opacity 1s;
        }

        #hint {
            font-family: var(--script);
            font-size: 1.6rem;
            color: var(--gold);
            animation: pulse 1.6s infinite;
            margin-top: 1rem;
            text-align: center;
            padding: 0 1rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        @keyframes pulse {
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }

        #btn, .b2 {
            padding: 0.85rem 2rem;
            border: 0;
            border-radius: 99px;
            font: 600 1.05rem var(--sans);
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6fae, #ff3d84);
            box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
            transition: transform 0.2s;
            z-index: 5;
        }

            #btn:hover, .b2:hover {
                transform: scale(1.07);
            }

            .b2.ghost {
                background: rgba(255, 255, 255, 0.1);
                box-shadow: none;
                border: 1px solid rgba(255, 182, 213, 0.5);
            }

        #card {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s;
            overflow-y: auto;
        }

            #card.show {
                opacity: 1;
                pointer-events: auto;
            }

        .box {
            position: relative;
            margin: auto;
            max-width: 420px;
            width: 100%;
            text-align: center;
            padding: 1.5rem 1.1rem 1.1rem;
            border-radius: 24px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 182, 213, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 90px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(255, 150, 200, 0.08);
            transform: scale(0.85) translateY(30px);
            transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
        }

        #card.show .box {
            transform: none;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.8rem;
            border-radius: 99px;
            font-size: 0.66rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #4a1240;
            font-weight: 600;
            background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
            box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
        }

        .big {
            font-size: 2.1rem;
            margin: 0.4rem 0 0;
            animation: beat 1.2s infinite;
        }

        @keyframes beat {
            15% {
                transform: scale(1.25);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.18);
            }
        }

        .t1 {
            font-family: var(--script);
            font-size: 1.25rem;
            color: var(--gold);
            margin: 0;
        }

        .t2 {
            font-family: var(--serif);
            font-size: clamp(1.7rem, 8vw, 2.4rem);
            margin: 0 0 0.2rem;
            background: linear-gradient(90deg, #ff9ec8, #fff, #ffd9a8, #ff6fae, #ff9ec8);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sh 5s linear infinite;
        }

        @keyframes sh {
            to {
                background-position: -250% 0;
            }
        }

        .orn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: center;
            color: var(--pink);
            margin: 0.4rem 0 1rem;
        }

            .orn:before, .orn:after {
                content: "";
                height: 1px;
                width: 22%;
                background: linear-gradient(90deg, transparent, var(--pink));
            }

            .orn:after {
                transform: scaleX(-1);
            }

        #msg {
            font-weight: 300;
            font-size: 0.88rem;
            line-height: 1.7;
            min-height: 6.4em;
            margin: 0 0.3rem;
        }

        /* THAY ĐỔI GIAO DIỆN 4 Ô ĐỂ CÓ THỂ BẤM */
        .wishes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.45rem;
            margin: 0.8rem 0;
        }

        .w {
            padding: 0.55rem 0.45rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 182, 213, 0.25);
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.2, 1.4, 0.3, 1);
            cursor: pointer;
        }

            .w.on {
                opacity: 1;
                transform: none;
            }

            .w:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 111, 174, 0.6);
                transform: translateY(-4px) scale(1.03);
                box-shadow: 0 8px 20px rgba(255, 111, 174, 0.2);
            }

            .w:active {
                transform: scale(0.98);
            }

            .w i {
                font-style: normal;
                font-size: 1.2rem;
                display: block;
            }

            .w b {
                display: block;
                font-family: var(--serif);
                font-size: 0.82rem;
                color: #ffc2dc;
                margin: 0.2rem 0;
            }

            .w span {
                font-size: 0.68rem;
                font-weight: 300;
                opacity: 0.85;
                line-height: 1.5;
                display: block;
            }

        .quote {
            font-family: var(--script);
            font-size: 1.1rem;
            color: var(--gold);
            line-height: 1.5;
            opacity: 0;
            transition: opacity 1.2s;
        }

        .sign {
            font-family: var(--script);
            font-size: 1.2rem;
            color: var(--pink);
            margin: 0.4rem 0 0.3rem;
            opacity: 0;
            transition: opacity 1.2s;
        }

        .on2 {
            opacity: 1;
        }

        .btns {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            transition: opacity 1s;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            z-index: 1;
            pointer-events: none;
            animation: up linear forwards;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
        }

        @keyframes up {
            to {
                transform: translate(var(--dx), -115vh) rotate(var(--rot));
                opacity: 0;
            }
        }

        .burst {
            position: fixed;
            z-index: 9;
            pointer-events: none;
            animation: bst 0.9s ease-out forwards;
        }

        @keyframes bst {
            to {
                transform: translate(var(--bx), var(--by)) scale(0.3);
                opacity: 0;
            }
        }

        /* CUSTOM CURSOR */
        * {
            cursor: none !important;
        }

        #cur {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 999;
            pointer-events: none;
            font-size: 26px;
            color: #fff;
            text-shadow: 0 0 12px #fff, 0 0 28px #74ebd5;
            opacity: 0;
            transition: opacity 0.3s;
        }

            #cur span {
                display: inline-block;
                animation: beat 1.2s infinite;
            }

        .trail {
            position: fixed;
            z-index: 98;
            pointer-events: none;
            color: #fff;
            transform: translate(-50%, -50%);
            animation: tr 1.1s ease-out forwards;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        @keyframes tr {
            to {
                transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
                opacity: 0;
            }
        }

        .btns small {
            font-size: 0.7rem;
            opacity: 0.65;
            letter-spacing: 0.06em;
            font-weight: 300;
        }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            padding: 1rem;
        }

            .modal-overlay.show {
                opacity: 1;
                pointer-events: auto;
            }

        .modal-box {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 182, 213, 0.4);
            box-shadow: 0 25px 90px rgba(255, 61, 132, 0.3), inset 0 0 40px rgba(255, 150, 200, 0.1);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.2, 1.2, 0.3, 1);
        }

        .modal-overlay.show .modal-box {
            transform: scale(1) translateY(0);
        }

        #modal-close {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: transparent;
            border: none;
            color: #ffb3d4;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

            #modal-close:hover {
                color: #fff;
                transform: scale(1.2) rotate(90deg);
            }

        .modal-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .modal-title {
            font-family: var(--serif);
            font-size: 1.6rem;
            color: #fff;
            margin: 0 0 1rem;
            text-shadow: 0 0 10px rgba(255, 111, 174, 0.5);
        }

        .modal-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #ffe6f0;
            text-align: justify;
            text-align-last: center;
            font-weight: 300;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
        <div class="line l1" id="l1"></div>
        <div class="line l2" id="l2"></div>
        <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
        <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
        <div class="box">
            <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
            <div class="big">💖</div>
            <p class="t1">Gửi riêng cho</p>
            <h1 class="t2" id="name"></h1>
            <div class="orn">❀ ❤ ❀</div>
            <div id="msg"></div>
            <div class="wishes" id="wishes"></div>
            <div class="quote" id="quote"></div>
            <div class="sign" id="sign"></div>
            <div class="btns" id="btns">
                <small>nhấn phím Space để thả thêm sao ♡</small>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL CHI TIẾT -->
    <div id="wish-modal" class="modal-overlay">
        <div class="modal-box">
            <button id="modal-close">✕</button>
            <div class="modal-icon" id="modal-icon"></div>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-text" id="modal-text"></div>
        </div>
    </div>

    <script>
              const CFG = {
                l1: "CHÚC MỪNG 20/10",
                l2: "SHUNA",
                name: "Shuna",
                intro:
                  "Nhân ngày 20/10, chúc Shuna luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
                wishes: [
                  [
                    "🌸",
                    "Luôn xinh đẹp",
                    "Rạng rỡ từ nụ cười đến trái tim.",
                    "Cầu mong shuna luôn giữ trọn nụ cười rạng rỡ và vẻ đẹp ngập tràn sức sống ấy. Không chỉ là nét đẹp rạng ngời phơi phới bên ngoài, mà còn là sự dịu dàng, trong trẻo và ấm áp tỏa ra từ sâu thẫm trái tim. Dù ở đâu hay trong khoảnh khắc nào, cậu vẫn luôn là bông hoa ngát hương và tỏa sáng nhất."
                  ],
                  [
                    "💖",
                    "Thật hạnh phúc",
                    "Mỗi ngày đều có một niềm vui nhỏ.",
                    "Mong rằng mỗi sớm mai thức dậy, cậu đều tìm thấy cho mình một niềm vui nhỏ bé để mỉm cười. Mong đời đong đầy cho em những dịu dàng, cho từng ngày trôi qua đều là một mảnh ghép ngọt ngào, để cậu luôn cảm thấy lòng mình được lấp đầy bởi sự mãn nguyện và ngập tràn hạnh phúc."
                  ],
                  [
                    "✨",
                    "Bình yên",
                    "Nhẹ nhàng giữa mọi bộn bề.",
                    "Giữa vô vàn ồn ào và bộn bề của cuộc sống, mong cậu luôn tìm thấy một khoảng trời thật đỗi an yên. Dù ngoài kia có giông bão hay xuôi ngược, hy vọng tâm hồn cậu vẫn giữ được sự nhẹ nhàng, thư thái, luôn vững vàng và bình thản bước qua mọi gập ghềnh."
                  ],
                  [
                    "🌹",
                    "Được yêu thương",
                    "Nhiều hơn cậu có thể đếm hết.",
                    "Mong cậu luôn được bao bọc trong tình yêu thương đong đầy — nhiều hơn cả những gì cậu có thể đếm hay hình dung. Xung quanh cậu sẽ luôn có những người sẵn sàng lắng nghe, thấu hiểu, trân trọng và dành cho cậu những điều chân thành, tuyệt vời nhất trên thế giới này."
                  ]
                ],
                quote: "Cảm ơn bạn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
                sign: "— Một người luôn nghĩ đến cậu 🌹",
              };
              const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
              const rnd = (a) =>
                Array.isArray(a) || typeof a === "string"
                  ? a[Math.floor(Math.random() * a.length)]
                  : 0;
              const R = (a, b) => Math.random() * (b - a) + a;
              const $ = (id) => document.getElementById(id);

              // --- BẦU TRỜI SAO 2D ---
              const canvas = document.getElementById("starfield");
              const ctx = canvas.getContext("2d");
              let cw, ch;

              function resizeCanvas() {
                cw = canvas.width = innerWidth;
                ch = canvas.height = innerHeight;
              }
              addEventListener("resize", resizeCanvas);
              resizeCanvas();

              const starsArr = [];
              const meteors = [];
              const numStars = 350;

              for (let i = 0; i < numStars; i++) {
                starsArr.push({
                  x: Math.random() * cw,
                  y: Math.random() * ch,
                  radius: Math.random() * 1.2 + 0.2,
                  opacity: Math.random(),
                  twinkleSpeed: Math.random() * 0.02 + 0.005,
                  vx: (Math.random() - 0.5) * 0.15,
                  vy: (Math.random() - 0.5) * 0.15,
                });
              }

              function createMeteor() {
                if (Math.random() < 0.015 && meteors.length < 3) {
                  meteors.push({
                    x: Math.random() * cw + cw * 0.5,
                    y: Math.random() * ch * 0.5,
                    len: Math.random() * 100 + 50,
                    speed: Math.random() * 10 + 8,
                    angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                    alpha: 1,
                  });
                }
              }

              function drawStars() {
                ctx.clearRect(0, 0, cw, ch);

                starsArr.forEach((s) => {
                  s.x += s.vx;
                  s.y += s.vy;

                  if (s.x < 0) s.x = cw;
                  if (s.x > cw) s.x = 0;
                  if (s.y < 0) s.y = ch;
                  if (s.y > ch) s.y = 0;

                  s.opacity += s.twinkleSpeed;
                  if (s.opacity > 1 || s.opacity < 0.1) s.twinkleSpeed *= -1;

                  ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                  ctx.beginPath();
                  ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                  ctx.fill();
                });

                createMeteor();
                for (let i = meteors.length - 1; i >= 0; i--) {
                  let m = meteors[i];
                  ctx.beginPath();
                  let endX = m.x - Math.cos(m.angle) * m.len;
                  let endY = m.y - Math.sin(m.angle) * m.len;

                  let grad = ctx.createLinearGradient(m.x, m.y, endX, endY);
                  grad.addColorStop(0, `rgba(255, 255, 255, ${m.alpha})`);
                  grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                  ctx.strokeStyle = grad;
                  ctx.lineWidth = 2;
                  ctx.moveTo(m.x, m.y);
                  ctx.lineTo(endX, endY);
                  ctx.stroke();

                  m.x += Math.cos(m.angle) * m.speed;
                  m.y += Math.sin(m.angle) * m.speed;
                  m.alpha -= 0.01;

                  if (m.alpha <= 0 || m.x < 0 || m.y > ch) {
                    meteors.splice(i, 1);
                  }
                }

                requestAnimationFrame(drawStars);
              }
              drawStars();
              // ----------------------

              for (let i = 0; i < 40; i++) {
                const s = document.createElement("div");
                s.className = "star";
                s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
                document.body.appendChild(s);
              }

              $("name").textContent = CFG.name;
              $("sign").textContent = CFG.sign;
              $("quote").textContent = CFG.quote;

              // Render 4 ô và gắn sự kiện click
              $("wishes").innerHTML = CFG.wishes
                .map(
                  (w, index) =>
                    `<div class="w" onclick="openWish(event, ${index})"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
                )
                .join("");

              // Hàm mở Modal
              window.openWish = function(event, index) {
                event.stopPropagation(); // Ngăn sự kiện nổi bọt lên thẻ card (tránh bắn pháo hoa đè lên)
                const w = CFG.wishes[index];
                $("modal-icon").textContent = w[0];
                $("modal-title").textContent = w[1];
                $("modal-text").textContent = w[3];
                $("wish-modal").classList.add("show");
              };

              // Đóng Modal
              $("modal-close").onclick = () => $("wish-modal").classList.remove("show");
              $("wish-modal").onclick = (e) => {
                if (e.target.id === "wish-modal") $("wish-modal").classList.remove("show");
              };

              const flyers = [];
              let W = innerWidth,
                H = innerHeight,
                decoding = false,
                landed = 0,
                total = 0;

              function build(el, text, cls) {
                [...text].forEach((c) => {
                  const s = document.createElement("span");
                  s.className = "slot" + (c === " " ? " sp" : "");
                  s.textContent = c === " " ? "\u00a0" : c;
                  el.appendChild(s);
                  if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
                });
              }
              build($("l1"), CFG.l1, "l1");
              build($("l2"), CFG.l2, "l2");
              total = flyers.length;

              function init() {
                flyers.forEach((f) =>
                  mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
                );
                for (let i = 0; i < 34; i++) {
                  const f = { real: false, c: "", cls: "" };
                  flyers.push(f);
                  mk(f, R(18, 56));
                }
                requestAnimationFrame(tick);
              }
              function mk(f, size) {
                const e = document.createElement("div");
                e.className = "fly";
                e.style.fontSize = size + "px";
                e.style.opacity = f.real ? 1 : 0.55;
                e.style.color = rnd([
                  "#ffb3d4",
                  "#ff6fae",
                  "#ffd9a8",
                  "#e0b3ff",
                  "#fff",
                ]);
                e.textContent = rnd(POOL);
                document.body.appendChild(e);
                Object.assign(f, {
                  el: e,
                  x: R(0, W),
                  y: R(0, H),
                  vx: R(-2.6, 2.6),
                  vy: R(-2.6, 2.6),
                  rot: R(0, 360),
                  vr: R(-4, 4),
                  t: R(0, 6),
                  sc: 1,
                  state: "fly",
                });
              }
              function tick() {
                flyers.forEach((f) => {
                  if (f.state === "done" || !f.el) return;
                  if (f.state === "fly") {
                    f.vx += R(-0.12, 0.12);
                    f.vy += R(-0.12, 0.12);
                    const m = Math.hypot(f.vx, f.vy),
                      mx = 3.2;
                    if (m > mx) {
                      f.vx *= mx / m;
                      f.vy *= mx / m;
                    }
                    f.x += f.vx;
                    f.y += f.vy;
                    f.rot += f.vr;
                    f.t += 0.04;
                    f.sc = 1 + Math.sin(f.t) * 0.35;
                    if (f.x < 0 || f.x > W) f.vx *= -1;
                    if (f.y < 0 || f.y > H) f.vy *= -1;
                    f.x = Math.max(-10, Math.min(W + 10, f.x));
                    f.y = Math.max(-10, Math.min(H + 10, f.y));
                  } else {
                    const k = 0.075;
                    f.x += (f.tx - f.x) * k;
                    f.y += (f.ty - f.y) * k;
                    f.rot += (0 - f.rot) * k;
                    f.sc += (1 - f.sc) * k;
                    if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
                      land(f);
                  }
                  f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
                });
                requestAnimationFrame(tick);
              }
              function land(f) {
                f.state = "done";
                f.el.remove();
                f.slot.classList.add("ok");
                sparkle(f.slot);
                if (++landed === total) {
                  $("hint").textContent = "Giải mã thành công 💖";
                  starStorm();
                  setTimeout(showCard, 1800);
                }
              }
              setInterval(
                () =>
                  flyers.forEach((f) => {
                    if (f.el && f.state !== "done" && Math.random() < 0.4)
                      f.el.textContent = rnd(POOL);
                  }),
                150,
              );

              function decode() {
                if (decoding) return;
                decoding = true;
                $("btn").style.display = "none";
                $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
                let i = 0;
                flyers.forEach((f) => {
                  if (f.real) {
                    setTimeout(
                      () => {
                        const r = f.slot.getBoundingClientRect();
                        f.tx = r.left + r.width / 2;
                        f.ty = r.top + r.height / 2;
                        f.rot = (((f.rot % 360) + 540) % 360) - 180;
                        f.state = "go";
                        f.el.textContent = f.c;
                      },
                      600 + i++ * 160,
                    );
                  } else {
                    setTimeout(
                      () => {
                        f.el.style.opacity = 0;
                      },
                      500 + R(0, 1500),
                    );
                    setTimeout(() => {
                      f.state = "done";
                      f.el.remove();
                    }, 2600);
                  }
                });
              }
              $("btn").onclick = decode;
              $("stage").addEventListener("click", (e) => {
                if (e.target.id !== "btn") decode();
              });
              addEventListener("resize", () => {
                W = innerWidth;
                H = innerHeight;
              });
              (document.fonts && document.fonts.ready
                ? document.fonts.ready
                : Promise.resolve()
              ).then(init);

              function sparkle(el) {
                const r = el.getBoundingClientRect();
                for (let i = 0; i < 4; i++)
                  burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
              }
              function burst(x, y, ch, size) {
                const b = document.createElement("div");
                b.className = "burst";
                b.textContent = ch;
                b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#fff;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 900);
              }

              const STARS_EMOJI = ["⭐", "🌟", "✨", "🌠", "💫"];
              function starFall() {
                const h = document.createElement("div");
                h.className = "heart";
                h.textContent = rnd(STARS_EMOJI);
                const d = R(5, 11);
                h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
                document.body.appendChild(h);
                setTimeout(() => h.remove(), d * 1000);
              }

              function starStorm() {
                for (let i = 0; i < 40; i++) setTimeout(starFall, i * 60);
              }

              function showCard() {
                $("stage").classList.add("hide");
                $("card").classList.add("show");
                setInterval(starFall, 280);
                starStorm();
                let i = 0;
                setTimeout(function type() {
                  $("msg").textContent = CFG.intro.slice(0, ++i);
                  if (i < CFG.intro.length) setTimeout(type, 40);
                  else {
                    document
                      .querySelectorAll(".w")
                      .forEach((w, k) =>
                        setTimeout(() => w.classList.add("on"), k * 350),
                      );
                    setTimeout(() => $("quote").classList.add("on2"), 1700);
                    setTimeout(() => $("sign").classList.add("on2"), 2500);
                    setTimeout(() => ($("btns").style.opacity = 1), 3000);
                  }
                }, 1200);
              }
              addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                  e.preventDefault();
                  if (!decoding) decode();
                  else starStorm();
                }
                if (e.code === "Escape") {
                  $("wish-modal").classList.remove("show");
                }
              });

              const cur = document.createElement("div");
              cur.id = "cur";
              cur.innerHTML = "<span>⭐</span>";
              document.body.appendChild(cur);
              let lt = 0;
              addEventListener("pointermove", (e) => {
                cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
                cur.style.opacity = 1;
                const n = performance.now();
                if (n - lt < 50) return;
                lt = n;
                const t = document.createElement("div");
                t.className = "trail";
                t.textContent = rnd(["⭐", "✨", "🌟"]);
                t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 1100);
              });
              document.addEventListener("mouseleave", () => (cur.style.opacity = 0));

              $("card").addEventListener("click", (e) => {
                if (e.target.tagName !== "BUTTON" && !e.target.closest('.w')) {
                  for (let i = 0; i < 6; i++)
                    burst(e.clientX, e.clientY, rnd(STARS_EMOJI), 18);
                }
              });
    </script>
</body>
</html>
